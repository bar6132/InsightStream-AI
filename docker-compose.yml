services:
  # --- RabbitMQ Message Broker ---
  rabbitmq:
    image: rabbitmq:3-management
    container_name: insightstream-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"  # Management UI → http://localhost:15673 (guest/guest)
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # --- Ollama Local LLM (Fallback for Summarization) ---
  ollama:
    image: ollama/ollama:latest
    container_name: insightstream-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # --- Backend Service ---
  backend:
    build: ./backend
    container_name: insightstream-backend
    ports:
      - "8004:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DEPLOYMENT_MODE=local
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy

  # --- Background Worker (RabbitMQ Consumer) ---
  worker:
    build: ./backend
    container_name: insightstream-worker
    command: python -u worker.py
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONUNBUFFERED=1
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # --- Frontend Service ---
  frontend:
    build: ./frontend
    container_name: insightstream-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    environment:
      # Browser calls (client-side) → localhost + backend port
      - NEXT_PUBLIC_API_URL=http://localhost:8004
      # Server-side Next.js API routes → internal Docker network
      - BACKEND_URL=http://backend:8000
      # Supabase Realtime (live feed updates only — not used for auth)
    restart: always
    depends_on:
      - backend

volumes:
  ollama_data: